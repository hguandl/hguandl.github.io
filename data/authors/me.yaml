bio: |
  I am a Lecturer in the College of Cryptology and Cyber Science at Nankai
  University, having joined in September 2025. I am a member of the NKSSecLab,
  working closely with Prof. Sen Chen.

  I earned my Ph.D. from the joint doctoral program between Southern University
  of Science and Technology (SUSTech) and The University of Queensland (UQ),
  where I was co-advised by Prof. Guangdong Bai and Associate Prof. Yepang Liu.
  My research focuses on enhancing the security and trustworthiness of software
  systems, with a specific interest in automated test generation.

